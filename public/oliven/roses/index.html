<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oliven · Rose garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EDDF; --bg2: #E9DFC8; --ink: #2B2620; --muted: #7A6F60; --line: #D8CCB2;
  --card: #FFFCF5; --wine: #7A1F3D; --rose: #C9567A; --gap-bg: #F6E3A8; --gap-ink: #6B4E00;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(120% 90% at 50% 0%, var(--bg) 0%, var(--bg2) 100%) fixed;
  color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 28px 16px 64px; }
.back { font: 600 12px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--wine); }
h1 { margin: 14px 0 6px; font: 700 40px/1.05 Fraunces, Georgia, serif; color: var(--wine); }
.lede { margin: 0 0 6px; color: var(--muted); }
.lede b { color: var(--ink); font-weight: 600; }

.hero { margin: 18px 0 0; }
.hero img { display: block; width: 100%; height: auto; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.hero figcaption { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
section {
  margin-top: 22px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink); overflow: hidden;
}
section h2 {
  margin: 0; padding: 12px 16px 10px; font: 600 11px Inter, sans-serif; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); border-bottom: 1px dashed var(--line);
  display: flex; justify-content: space-between;
}
ol { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 30px 1fr; gap: 0 10px; padding: 11px 16px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
li .n { font: 500 13px/1.6 Fraunces, Georgia, serif; color: var(--rose); text-align: right; }
li .name { font: 700 18px/1.25 Fraunces, Georgia, serif; }
li a.name { color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--rose); }
li a.name:hover { color: var(--wine); border-color: var(--wine); }
li a.name::after { content: " ↗"; font: 500 12px Inter, sans-serif; color: var(--muted); }
li .meta { grid-column: 2; font-size: 13px; color: var(--muted); margin-top: 2px; }
li .corner { display: inline-block; margin-left: 6px; padding: 0 7px; border: 1.5px solid var(--ink); border-radius: 999px; font: 600 10px/1.6 Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; vertical-align: 3px; }
li .said { font-style: italic; }
li .check { grid-column: 2; margin-top: 6px; padding: 5px 9px; border-radius: 8px; background: var(--gap-bg); color: var(--gap-ink); font-size: 12.5px; justify-self: start; }
footer { margin-top: 26px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 480px) { h1 { font-size: 34px; } li .name { font-size: 17px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Oliven map</a>
  <h1>Rose garden</h1>
  <p class="lede" id="lede"></p>
  <figure class="hero"><img src="fountain.jpg" alt="Stone bowl fountain at the center of the rose garden, with rose beds and gravel paths around it" width="1600" height="1200"><figcaption>The fountain at the center, where the four islands meet.</figcaption></figure>
  <div id="list"></div>
  <footer>Walking order: in through the entrance, counterclockwise around the outside beds keeping them on your right, then the four islands. Links go to the breeder or a rose database.</footer>
</main>
<script src="../data.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const roses = (window.OLIVEN && window.OLIVEN.roses) || []
const islands = roses.filter(r => r.area.startsWith('Island')).length
const checks = roses.filter(r => r.check).length
document.getElementById('lede').innerHTML = `<b>${roses.length} roses</b>: ${roses.length - islands} around the outside beds and ${islands} in the four island beds, around the fountain.` + (checks ? ` ${checks} tag${checks > 1 ? 's' : ''} still to check.` : '')
const areas = [...new Set(roses.map(r => r.area))]
let n = 0
document.getElementById('list').innerHTML = areas.map(a => {
  const rs = roses.filter(r => r.area === a)
  return `<section><h2><span>${esc(a)}</span><span>${rs.length}</span></h2><ol>` + rs.map(r => {
    n++
    const corner = / · corner$/.test(r.note)
    const note = r.note.replace(/ · corner$/, '')
    const name = r.url ? `<a class="name" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : `<span class="name">${esc(r.name)}</span>`
    const meta = [esc(note), r.said ? `<span class="said">called out as “${esc(r.said)}”</span>` : ''].filter(Boolean).join(' · ')
    return `<li><span class="n">${n}</span><div>${name}${corner ? '<span class="corner">Corner</span>' : ''}</div>` +
      (meta ? `<div class="meta">${meta}</div>` : '') +
      (r.check ? `<div class="check">${esc(r.check)}</div>` : '') + '</li>'
  }).join('') + '</ol></section>'
}).join('')
</script>
</body>
</html>
