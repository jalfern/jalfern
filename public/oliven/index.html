<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oliven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EDDF; --bg2: #E9DFC8; --ink: #2B2620; --muted: #7A6F60; --line: #D8CCB2;
  --card: #FFFCF5; --wine: #7A1F3D; --gap-bg: #F6E3A8; --gap-ink: #6B4E00;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 20%, var(--bg) 0%, var(--bg2) 100%);
  color: var(--ink); font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; }
#north svg { display: block; }
[data-f] { cursor: pointer; }
.hot { filter: brightness(1.12) saturate(1.1); }

header {
  position: fixed; top: 16px; left: 16px; pointer-events: none; max-width: calc(100% - 32px);
}
header h1 { margin: 0; font: 700 34px/1 Fraunces, Georgia, serif; letter-spacing: .01em; color: var(--wine); }
#north { margin-top: 10px; display: flex; align-items: center; gap: 6px; font: 600 11px Inter, sans-serif; color: var(--muted); letter-spacing: .1em; }
header p { margin: 6px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

#labels { position: fixed; inset: 0; pointer-events: none; }
.lbl {
  position: absolute; transform: translate(-50%, -100%); white-space: nowrap;
  background: var(--card); border: 2px solid var(--ink); border-radius: 999px;
  padding: 3px 10px 3px 8px; font: 600 12px/1.2 Inter, sans-serif; color: var(--ink);
  box-shadow: 0 3px 0 var(--ink); pointer-events: auto; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: opacity .2s;
}
.lbl::after {
  content: ""; position: absolute; left: 50%; bottom: -9px; width: 2px; height: 7px;
  background: var(--ink); transform: translateX(-50%);
}
.lbl i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--wine)); flex: none; }
.lbl.on { background: var(--wine); color: #fff; border-color: var(--wine); box-shadow: 0 3px 0 #4a1024; }
.lbl.on i { background: #fff; }
.lbl.hide { opacity: 0; pointer-events: none; }

#card {
  position: fixed; right: 16px; top: 16px; width: 340px; max-height: calc(100% - 32px); overflow: auto;
  background: var(--card); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 5px 0 var(--ink);
  padding: 18px 18px 16px; transform: translateY(8px); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
}
#card.show { opacity: 1; transform: none; pointer-events: auto; }
#card .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#card h2 { margin: 4px 0 8px; font: 700 26px/1.1 Fraunces, Georgia, serif; }
#card p { margin: 0 0 10px; }
#card .x {
  position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
  border: 0; background: transparent; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer;
}
#card .x:hover { background: var(--bg); color: var(--ink); }
.gap {
  margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--gap-bg); color: var(--gap-ink);
  font-size: 12.5px;
}
.gap b { font-weight: 600; }
.chart { margin: 12px 0 4px; border-top: 1px dashed var(--line); padding-top: 10px; }
.chart .t { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
.bar { flex: 1; background: var(--wine); border-radius: 4px 4px 0 0; position: relative; min-width: 14px; }
.bar span { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
.bar em { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; font-style: normal; }
.big { font: 700 30px/1.1 Fraunces, Georgia, serif; color: var(--wine); }
.big small { display: block; font: 500 12px/1.4 Inter, sans-serif; color: var(--muted); margin-top: 4px; }
.cmp { margin-top: 12px; display: grid; gap: 6px; }
.cmp .row { display: grid; grid-template-columns: 62px 1fr 48px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.cmp i { display: block; height: 10px; border-radius: 5px; background: #D6CBB0; }
.cmp .row.me { color: var(--ink); font-weight: 600; }
.cmp .row.me i { background: var(--wine); }
.cmp b { text-align: right; font-weight: 600; }
.bar.best { background: #A8324F; }
.bar.none { height: 18% !important; background: repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 8px); border: 1px dashed var(--line); }
.bar.none em { color: var(--muted); }
.empty { height: 64px; border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 0 12px; }
.note { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

#tools { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
#tools button {
  width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--ink); background: var(--card);
  box-shadow: 0 3px 0 var(--ink); font: 600 18px/1 Inter, sans-serif; color: var(--ink); cursor: pointer;
}
#tools button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
#tools .swap { display: grid; place-items: center; height: 42px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--ink); background: var(--wine); color: #fff; box-shadow: 0 3px 0 #4a1024; font: 600 13px/1 Inter, sans-serif; text-decoration: none; }
#tools button.wide { width: auto; padding: 0 12px; font-size: 13px; }
#hint { position: fixed; left: 16px; bottom: 20px; font-size: 12px; color: var(--muted); pointer-events: none; }
button:focus-visible, .lbl:focus-visible { outline: 3px solid var(--wine); outline-offset: 2px; }

@media (max-width: 640px) {
  header h1 { font-size: 28px; }
  #card {
    left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 55%;
    transform: translateY(24px);
  }
  #hint { display: none; }
  #tools { right: 12px; bottom: 16px; }
  #tools button { width: 38px; height: 38px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
#card a.more { color: var(--wine); font-weight: 600; text-decoration: none; border-bottom: 1.5px solid currentColor; }
</style>
</head>
<body>
<div id="stage"><svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Isometric map of the Oliven property" role="img"></svg></div>
<div id="labels"></div>
<header>
  <h1>Oliven</h1>
  <p>Calistoga · Napa Valley</p>
  <div id="north" aria-label="North arrow"><svg viewBox="-20 -20 40 40" width="40" height="40"><circle r="17" fill="#FFFCF5" stroke="#2B2620" stroke-width="2.5"/><g transform="rotate(63.4)"><path d="M0 -13 L5 2 L0 -1 L-5 2 Z" fill="#7A1F3D"/><path d="M0 13 L5 -2 L0 1 L-5 -2 Z" fill="#CFC3A3"/></g></svg><span>N</span></div>
</header>
<div id="hint">Drag to move · scroll or pinch to zoom · tap anything</div>
<div id="tools">
  <a class="wide swap" href="/oliven/3d/">3D</a>
  <button id="tLabels" class="wide" aria-pressed="true">Labels</button>
  <button id="zOut" aria-label="Zoom out">−</button>
  <button id="zIn" aria-label="Zoom in">+</button>
  <button id="zFit" aria-label="Reset view">⤢</button>
</div>
<aside id="card" aria-live="polite"></aside>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
